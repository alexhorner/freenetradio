[package]
name = "ram-split"
version = "0.1.0"
edition = "2021"
description = "One-off tool that sets the CH32V307 flash/RAM split to 192K + 128K for FreeNetRadio"
license = "MIT"
repository = "https://github.com/alexhorner/freenetradio"

[dependencies]
ch32-hal = { git = "https://github.com/ch32-rs/ch32-hal", rev = "a0863ebcc1082f64e508b73d3b944f119b0db77b", features = [
    "ch32v307vct6",
    "rt",
] }
panic-halt = "1.0"

[profile.release]
strip = false
lto = true
opt-level = "z"
